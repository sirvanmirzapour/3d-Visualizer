name: magnetic_field_scanner
description: "A new Flutter project."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  flutter_classic_bluetooth: ^1.7.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "GlobalMask.png"
  android: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "GlobalMask.png"

flutter:
  uses-material-design: true
